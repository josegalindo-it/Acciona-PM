  proyecto:
    titulo: Cómo estructuraría la gestión de la demanda entre negocio y tecnología.
    problema:
      subtitulo: El problema
      cuerpo: 'Un equipo situado entre las áreas de negocio y varios equipos técnicos recibe demanda de
        naturaleza muy distinta: desde incidencias operativas hasta nuevos proyectos de IA, con un stack
        cloud en replanteamiento. El riesgo no está en la tecnología en sí, sino en la gestión que la
        rodea: necesidades mal definidas que llegan al equipo equivocado, áreas de negocio que piden cosas
        parecidas sin que nadie las una, y proyectos nuevos que arrancan sin alcance, plazos ni responsables
        claros.'
    solucion:
      subtitulo: La solución propuesta
      cuerpo: 'Un circuito de gestión de la demanda simple y trazable: cada petición se recoge, se clasifica
        (incidencia, mejora, proyecto), se concreta con el área solicitante y se deriva al equipo adecuado
        con un alcance acordado. Las necesidades comunes entre áreas se agrupan para atenderlas una sola
        vez, en coordinación con gobierno del dato. Los proyectos que lo requieren se arrancan con un
        mínimo de alcance, planificación, proveedores y metodología desde el primer día, y la adopción
        de nuevas tecnologías se acompaña con las áreas de negocio, no se deja a su suerte tras el despliegue.'
    arquitectura:
      flujo: []
      pie: ''
      imagen: ''
      puntos:
      - etiqueta: Entrada y clasificación de la demanda
        descripcion: punto único de recogida de necesidades de negocio, clasificadas por tipo y urgencia,
          con criterio explícito para decidir qué se resuelve por la vía operativa y qué se convierte
          en proyecto.
      - etiqueta: Derivación a los equipos técnicos
        descripcion: cada petición llega a DevOps, desarrollo, datos, despliegues o IA con alcance, responsable
          y plazo acordados, en lugar de un correo sin cerrar.
      - etiqueta: Arranque y seguimiento de proyectos
        descripcion: definición, planificación, plazos y metodología para los proyectos completos, con
          proveedores coordinados contra sus compromisos y reporting al comité semanal del equipo.
      - etiqueta: Alineación entre áreas
        descripcion: necesidades comunes de varias áreas de negocio identificadas y unificadas, junto
          al equipo de gobierno del dato.
      - etiqueta: Límite, declarado explícitamente
        descripcion: esta propuesta gobierna demanda, planificación y coordinación. No se extiende a la
          decisión de arquitectura cloud (GCP, Azure, AWS) ni a la implementación técnica, que corresponden
          a los equipos especializados.
      aclaracion: gobierno de la demanda y del proyecto entre negocio y tecnología — no configuración
        de plataformas cloud ni desarrollo, que corresponden a los equipos técnicos especializados
    cita: ''
    eyebrow: Proyecto · Propuesta
    etiqueta_nav: Proyecto
  plan_riesgos:
    titulo: Un circuito de demanda funcionando desde la primera semana, no descubierto en la primera crisis.
    primera_semana:
      subtitulo: Primera semana
      elementos:
      - etiqueta: Mapa de stakeholders y equipos
        descripcion: reuniones con la responsable del área, los equipos técnicos (DevOps, desarrollo,
          datos, despliegues, IA) y las áreas de negocio con más demanda, para entender quién pide qué
          y a quién se deriva hoy.
      - etiqueta: Inventario de la demanda abierta
        descripcion: recoger y clasificar lo que ya está en curso (incidencias, mejoras, proyectos), identificando
          duplicidades entre áreas y prioridades de arranque inmediato.
      - etiqueta: Primer comité de equipo
        descripcion: participar en el comité semanal de los miércoles con un primer cuadro de demanda
          y proyectos, y acordar el formato de seguimiento.
    riesgos:
      subtitulo: Riesgos
      elementos:
      - etiqueta: Demanda heterogénea que satura el circuito
        descripcion: criterio explícito de clasificación entre incidencia, mejora y proyecto desde el
          inicio, para que lo operativo no desplace a los proyectos ni al revés.
      - etiqueta: Stack cloud en replanteamiento (GCP, Azure y AWS en evaluación)
        descripcion: mantener las peticiones desacopladas de una plataforma concreta y registrar las dependencias
          técnicas, para que un cambio de stack no invalide el alcance acordado.
      - etiqueta: Necesidades de negocio solapadas o en conflicto
        descripcion: unificarlas con gobierno del dato antes de derivarlas, en lugar de duplicar trabajo
          en equipos técnicos distintos.
      - etiqueta: Adopción de nuevas tecnologías, incluida la IA, sin acompañamiento al negocio
        descripcion: incluir el acompañamiento al área solicitante en el alcance de cada proyecto, no
          solo el despliegue.
    eyebrow: Plan y riesgos
    etiqueta_nav: Plan
  cierre:
    titulo: Disponible de inmediato para ser el enlace entre negocio y tecnología desde la primera semana.
    subtitulo: Disponibilidad inmediata, con base en Madrid y en modalidad híbrida, con presencia en oficina
      los días que se acuerden en la fase inicial. Me encantaría conversar sobre cómo estructuraría la
