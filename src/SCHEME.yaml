  motivacion:
    titulo: Un rol de enlace entre negocio y tecnología — y esa es exactamente mi forma de trabajar.
    subtitulo: ''
    parrafos:
    - texto: 'La oferta describe un puesto situado entre las áreas de negocio y los equipos de DevOps,
        desarrollo, datos, despliegues e IA: recibir necesidades muy distintas, entenderlas, darles forma
        y dirigirlas a quien corresponda, y en los casos que lo requieran montar el proyecto desde cero
        hasta su puesta en marcha. Es el tipo de coordinación que llevo más de veinte años ejerciendo,
        siempre con un pie en la tecnología y otro en el negocio.'
      lede: true
    - texto: 'Quiero ser claro en un punto: mi trayectoria se ha desarrollado en banca, seguros y telecomunicaciones,
        no en construcción ni en energía. Lo que aporto es la disciplina de gestión de la demanda, de
        stakeholders y de proveedores en organizaciones grandes y complejas, que es el núcleo de este
        puesto; herramientas que ya manejo, como Jira y ServiceNow; y la capacidad de incorporar rápido
        el contexto de un grupo como ACCIONA. Disponibilidad inmediata, con base en Madrid y modalidad
        híbrida.'
      lede: false
